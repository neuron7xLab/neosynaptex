repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
  - repo: local
    hooks:
      - id: coverage-check
        name: coverage-check
        entry: python -m pytest --cov=src/bnsyn --cov-fail-under=90 -q
        language: system
        pass_filenames: false
      - id: no-pdb
        name: no-pdb
        entry: bash -c '! rg -n "\bpdb\.set_trace\(" src tests'
        language: system
        pass_filenames: false
      - id: validate-claims
        name: validate-claims
        entry: python scripts/check_regime_release_gate.py
        language: system
        pass_filenames: false
