name: bn-syn-regime-gate
on: [push, pull_request]
jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .
      - run: pip install mypy ruff pytest-cov
      - run: ruff check .
      - run: mypy src --config-file pyproject.toml
      - run: python -m pytest --cov=src/bnsyn --cov-fail-under=90 -q
      - run: python scripts/check_regime_release_gate.py
