[project]
name = "bnsyn"
version = "0.1.1"
description = "BN-Syn regime control subsystem"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy",
  "scipy",
  "pydantic",
  "pyyaml",
  "jsonschema",
  "joblib",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "hypothesis",
  "ruff",
  "mypy",
  "pre-commit",
  "validate-pyproject",
  "pylint",
  "pydocstyle",
  "bandit",
  "pip-audit",
  "build",
  "packaging",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = [".", "src"]
markers = [
  "validation: validation tests",
  "performance: performance tests",
  "golden: golden regression tests",
  "chaos: chaos and resilience tests",
  "benchmark: benchmark tests"
]

[tool.hypothesis]
max_examples = 120
derandomize = true
deadline = 1000
print_blob = true

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["numpy.*"]
ignore_missing_imports = false
