name: protocol-ci
on: [push, pull_request]
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pytest jsonschema hypothesis pydantic ruff mypy
      - run: ruff check core/eai contracts/eai tests/eai
      - run: mypy core/eai contracts/eai tests/eai
      - run: pytest tests/eai/protocol -q
      - run: pytest tests/eai/integration -q
